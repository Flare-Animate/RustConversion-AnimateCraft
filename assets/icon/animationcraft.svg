<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- AnimationCraft app icon. Original artwork for this project (MIT OR Apache-2.0).
       A ball arcing across a timeline, with onion-skin ghosts of its earlier frames. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2F6B"/>
      <stop offset="1" stop-color="#0E7C86"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset="0.45" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F0662E"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- timeline: frame ticks along the bottom -->
  <g fill="#FFFFFF" opacity="0.28">
    <rect x="40" y="198" width="176" height="6" rx="3"/>
  </g>
  <g fill="#FFFFFF" opacity="0.55">
    <rect x="46" y="186" width="6" height="30" rx="3"/>
    <rect x="94" y="190" width="6" height="22" rx="3"/>
    <rect x="142" y="190" width="6" height="22" rx="3"/>
    <rect x="190" y="186" width="6" height="30" rx="3"/>
  </g>
  <!-- motion path -->
  <path d="M52 168 Q 96 30 190 92" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"
        stroke-width="5" stroke-linecap="round" stroke-dasharray="2 13"/>
  <!-- onion-skin ghosts (earlier frames) -->
  <circle cx="62" cy="142" r="17" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="88" cy="100" r="20" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="125" cy="76" r="23" fill="#FFFFFF" opacity="0.40"/>
  <!-- the ball, squashed slightly along its travel -->
  <g transform="translate(176 88) rotate(24) scale(1.06 0.95)">
    <circle r="36" fill="url(#ball)"/>
    <ellipse cx="-11" cy="-13" rx="11" ry="7" fill="#FFFFFF" opacity="0.55"/>
  </g>
</svg>
