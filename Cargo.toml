[workspace]
resolver = "2"
members = ["crates/ac-core", "crates/ac-render", "crates/ac-script", "crates/ac-xfl", "crates/ac-audio", "crates/ac-package", "crates/ac-cli", "crates/ac-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Flare-Animate/RustConversion-AnimateCraft"

[workspace.dependencies]
ac-core = { path = "crates/ac-core" }
ac-render = { path = "crates/ac-render" }
ac-script = { path = "crates/ac-script" }
ac-xfl = { path = "crates/ac-xfl" }
ac-audio = { path = "crates/ac-audio" }
ac-package = { path = "crates/ac-package" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
gif = "0.13"
png = "0.17"
# EffectCraft (ArtCraft, MIT OR Apache-2.0) effects library, used as a git
# dependency rather than copied: `cargo update -p effectcraft-effects` pulls
# their latest main; Cargo.lock pins the commit we built and tested with.
effectcraft-effects = { git = "https://github.com/storytold/effectcraft", branch = "main" }
effectcraft-raster = { git = "https://github.com/storytold/effectcraft", branch = "main" }
effectcraft-keyframe = { git = "https://github.com/storytold/effectcraft", branch = "main" }
effectcraft-project = { git = "https://github.com/storytold/effectcraft", branch = "main" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
