name: Windows build

# Builds flare.exe + flare-cli.exe and the installer.
# Runs on demand (Actions tab → "Run workflow") and on version tags (v0.2.0 …);
# tags also attach the files to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Build
        run: cargo build --release -p ac-app -p ac-cli

      - name: Test
        run: cargo test --workspace --release

      - name: Version
        id: ver
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Installer (NSIS)
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; }
          & $nsis "-DVERSION=${{ steps.ver.outputs.version }}" "-DBINDIR=..\..\target\release" packaging\windows\installer.nsi

      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "Flare-${{ steps.ver.outputs.version }}-windows"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target\release\flare.exe, target\release\flare-cli.exe, LICENSE-MIT, LICENSE-APACHE $dir
          Compress-Archive $dir "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Flare-windows
          path: |
            target/release/Flare-*-setup.exe
            Flare-*-windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/Flare-*-setup.exe
            Flare-*-windows.zip
