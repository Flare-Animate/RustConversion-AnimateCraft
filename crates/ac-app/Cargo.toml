[package]
name = "ac-app"
description = "AnimationCraft desktop editor (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "animationcraft"
path = "src/main.rs"

[features]
default = ["audio"]
# Sound playback through the system output (needs ALSA headers on Linux: libasound2-dev).
audio = ["ac-audio/playback"]

[dependencies]
ac-audio.workspace = true
ac-core.workspace = true
ac-render.workspace = true
ac-script.workspace = true
ac-xfl.workspace = true
ac-package.workspace = true
tiny-skia.workspace = true
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
usvg = "0.44"
serde.workspace = true
serde_json.workspace = true
